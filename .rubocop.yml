AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  Exclude:
    - 'vendor/**/*'

Style/StringLiterals:
  EnforcedStyle: single_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Layout/LineLength:
  Exclude:
    - 'filterable.gemspec'

# `class_methods do` is the ActiveSupport::Concern DSL wrapping the whole
# class-level API: its length tracks the number of public methods, not the
# complexity of any of them (each method stays covered by the other metrics).
Metrics/BlockLength:
  AllowedMethods:
    - class_methods
  Exclude:
    - 'spec/**/*'
    - 'filterable.gemspec'

# Spec support code is declarative (schema definitions, harness setup): its
# length tracks the number of tables and columns, not complexity. Production
# code under lib/ stays fully covered.
Metrics/AbcSize:
  Exclude:
    - 'spec/**/*'
Metrics/MethodLength:
  Exclude:
    - 'spec/**/*'
