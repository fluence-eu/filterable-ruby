[changelog]
header = """# Changelog\n
All notable changes to this project will be documented in this file.\n"""
body = """
{% if version -%}
  ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
  ## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
  {% for commit in commits %}
    - {{ commit.message | split(pat="\n") | first | trim }}\
  {% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = false
split_commits = false
commit_parsers = [
  # Conventional Commits
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^refactor", group = "Refactored" },
  { message = "^perf", group = "Performance" },
  { message = "^docs", group = "Documentation" },
  { message = "^style", group = "Style" },
  { message = "^test", group = "Tests" },
  { message = "^build", group = "Build" },
  { message = "^ci", group = "CI" },
  { message = "^chore", group = "Other" },
  { message = "^revert", group = "Reverted" },
  # Legacy verb-based commits
  { message = "^[Aa]dd |^[Ii]mplement |^[Cc]reate |^[Ii]ntegrate ", group = "Added" },
  { message = "^[Ff]ix |^[Rr]estore |^[Uu]nskip ", group = "Fixed" },
  { message = "^[Uu]pdate |^[Ii]mprove |^[Rr]eplace |^[Rr]ename |^[Dd]isable |^[Ee]xclude |^[Rr]estrict ", group = "Changed" },
  { message = "^[Rr]efactor |^[Ee]xtract |^[Ss]implify |^[Mm]ove ", group = "Refactored" },
  { message = "^[Rr]emove |^[Cc]lean |^[Dd]rop ", group = "Removed" },
  # Skip
  { message = "^release: ", skip = true },
  { message = "^[Bb]ump version", skip = true },
  { message = "^Merge pull request", skip = true },
  { message = "^WIP ", skip = true },
  { message = ".*", group = "Other" },
]
tag_pattern = "v[0-9].*"
sort_commits = "newest"
