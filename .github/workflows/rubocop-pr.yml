name: RuboCop PR Check

on:
  pull_request:

jobs:
  rubocop:
    uses: fluence-eu/ci-workflows/.github/workflows/ruby-gem-rubocop-pr.yml@v1
    secrets:
      FLUENCE_CI_BOT_PRIVATE_KEY: ${{ secrets.FLUENCE_CI_BOT_PRIVATE_KEY }}
    permissions:
      contents: read
      pull-requests: write
      actions: read
