name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read
  # fluence-ci-tools lives on GitHub Packages — bundle install needs to read it.
  packages: read

env:
  # Authenticate Bundler against the fluence-eu GitHub Packages registry.
  BUNDLE_RUBYGEMS__PKG__GITHUB__COM: x-access-token:${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        # Latest stable Rails across supported Ruby versions, using the root
        # Gemfile (no Rails pin, so bundler resolves the most recent release).
        ruby:
          - '4.0'
          - '3.4'
          - '3.3'
          - '3.2'

    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run specs
        run: SKIP_COVERAGE=true bundle exec rake spec
