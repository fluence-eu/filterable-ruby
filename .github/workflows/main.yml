name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    name: Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        # Latest stable Rails across supported Ruby versions, using the root
        # Gemfile (no Rails pin, so bundler resolves the most recent release).
        ruby:
          - '4.0'
          - '3.4'
          - '3.3'
          - '3.2'

    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run specs
        run: SKIP_COVERAGE=true bundle exec rake spec
